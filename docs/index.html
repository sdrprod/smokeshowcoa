<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify COA Manager - Smoke Show Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .status-message {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Update SSL Certificates of Analysis</h1>
            <p class="text-gray-600">Manage COA PDFs and update your Shopify page automatically</p>
        </div>

        <!-- Credentials Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">Shopify Connection</h2>
            <div class="space-y-4">
                <div>
                    <label for="shopifyDomain" class="block text-sm font-medium text-gray-700 mb-2">
                        Shopify Domain
                    </label>
                    <input
                        type="text"
                        id="shopifyDomain"
                        placeholder="your-store.myshopify.com"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                </div>
                <div>
                    <label for="accessToken" class="block text-sm font-medium text-gray-700 mb-2">
                        Access Token
                    </label>
                    <input
                        type="password"
                        id="accessToken"
                        placeholder="shpat_••••••••••••••••"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                </div>
                <div class="flex gap-3">
                    <button
                        id="saveCredentials"
                        class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium transition"
                    >
                        Save & Connect
                    </button>
                    <button
                        id="testConnection"
                        class="px-6 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 font-medium transition"
                        disabled
                    >
                        Test Connection
                    </button>
                </div>
                <div id="connectionStatus" class="text-sm"></div>
            </div>
        </div>

        <!-- Main Action Section -->
        <div id="mainSection" class="bg-white rounded-lg shadow-md p-6 mb-6" style="display: none;">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">COA Management</h2>

            <!-- Action Selection -->
            <div class="mb-6">
                <label for="actionSelect" class="block text-sm font-medium text-gray-700 mb-2">
                    Select Action
                </label>
                <select
                    id="actionSelect"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
                    <option value="">-- Choose an action --</option>
                    <option value="add">Add a New COA</option>
                    <option value="modify">Modify an Existing COA</option>
                    <option value="delete">Delete an Existing COA</option>
                </select>
            </div>

            <!-- Add/Modify Form -->
            <div id="addModifyForm" style="display: none;">
                <!-- File Selection (Modify only) -->
                <div id="fileSelectSection" style="display: none;" class="mb-4">
                    <label for="existingFileSelect" class="block text-sm font-medium text-gray-700 mb-2">
                        Select Existing COA <span class="text-red-500">*</span>
                    </label>
                    <select
                        id="existingFileSelect"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                        <option value="">-- Loading files... --</option>
                    </select>
                </div>

                <!-- Title -->
                <div class="mb-4">
                    <label for="coaTitle" class="block text-sm font-medium text-gray-700 mb-2">
                        Title <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="text"
                        id="coaTitle"
                        placeholder="e.g., Black Amber"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        required
                    />
                </div>

                <!-- Test Date -->
                <div class="mb-4">
                    <label for="testDate" class="block text-sm font-medium text-gray-700 mb-2">
                        Test Date (optional)
                    </label>
                    <input
                        type="date"
                        id="testDate"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label for="coaDescription" class="block text-sm font-medium text-gray-700 mb-2">
                        Description (optional, max 220 characters)
                    </label>
                    <textarea
                        id="coaDescription"
                        maxlength="220"
                        rows="3"
                        placeholder="Brief description of this COA..."
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    ></textarea>
                    <div class="text-xs text-gray-500 mt-1">
                        <span id="charCount">0</span>/220 characters
                    </div>
                </div>

                <!-- File Upload -->
                <div class="mb-6">
                    <label for="coaFile" class="block text-sm font-medium text-gray-700 mb-2">
                        <span id="fileUploadLabel">PDF File</span> <span id="fileRequired" class="text-red-500">*</span>
                    </label>
                    <input
                        type="file"
                        id="coaFile"
                        accept="application/pdf,.pdf"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                    />
                </div>

                <button
                    id="submitAction"
                    class="w-full px-6 py-3 bg-green-600 text-white rounded-md hover:bg-green-700 font-medium transition text-lg"
                >
                    Submit
                </button>
            </div>

            <!-- Delete Form -->
            <div id="deleteForm" style="display: none;">
                <div class="mb-4">
                    <label for="deleteFileSelect" class="block text-sm font-medium text-gray-700 mb-2">
                        Select COA to Delete <span class="text-red-500">*</span>
                    </label>
                    <select
                        id="deleteFileSelect"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                        <option value="">-- Loading files... --</option>
                    </select>
                </div>

                <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-md">
                    <label class="flex items-start gap-3">
                        <input
                            type="checkbox"
                            id="deleteConfirm"
                            class="mt-1 h-4 w-4 text-red-600 focus:ring-red-500 border-gray-300 rounded"
                        />
                        <span class="text-sm text-red-900 font-medium">
                            I understand this action cannot be undone. The file will be permanently deleted from Shopify and removed from the COA page.
                        </span>
                    </label>
                </div>

                <button
                    id="submitDelete"
                    class="w-full px-6 py-3 bg-red-600 text-white rounded-md hover:bg-red-700 font-medium transition text-lg disabled:bg-gray-400 disabled:cursor-not-allowed"
                    disabled
                >
                    Delete COA
                </button>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusArea" class="mb-6"></div>

        <!-- Link to COA Page -->
        <div id="linkSection" class="text-center" style="display: none;">
            <a
                href="https://smokeshowlabs.com/pages/certificates-of-analysis-independent-lab-results"
                target="_blank"
                rel="noopener"
                class="inline-block px-8 py-3 bg-purple-600 text-white rounded-md hover:bg-purple-700 font-medium transition text-lg"
            >
                Open the COA Page
            </a>
        </div>

        <!-- Footer -->
        <div class="text-center text-gray-500 text-sm mt-8">
            <p>Shopify COA Manager v1.0 | Smoke Show Labs</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
